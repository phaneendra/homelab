services:
  shared-postgres:
    image: pgvector/pgvector:pg18
    restart: unless-stopped
    # Expands shared memory allocation from default 64MB to 1GB for vector indices
    shm_size: '1gb'
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
      MULTIPLE_DATABASES: ${MULTIPLE_DATABASES:-}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - ~/docker-data/postgres-data:/var/lib/postgresql
      - ./files/init-multiple-databases.sh:/docker-entrypoint-initdb.d/init-multiple-databases.sh:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'pg_isready -U "${POSTGRES_USER:-postgres}" -d "${POSTGRES_DB:-postgres}"',
        ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - traefik

networks:
  traefik:
    external: true
    name: traefik
