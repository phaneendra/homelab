version: '3.8'

services:
  forgejo:
    image: forgejo/forgejo:latest
    container_name: forgejo
    restart: unless-stopped
    user: "1000:1000"
    ports:
      - "${FORGEJO_HTTP_PORT:-3000}:3000"
      - "${FORGEJO_SSH_PORT:-2222}:22"
    environment:
      # Database connection (template-style envs; set in .env or system)
      - DB_TYPE=${FORGEJO_DB_TYPE:-postgres}
      - DB_HOST=${FORGEJO_DB_HOST:-shared-postgres:5432}
      - DB_NAME=${FORGEJO_DB_NAME:-forgejo}
      - DB_USER=${FORGEJO_DB_USER:-forgejo}
      - DB_PASS=${FORGEJO_DB_PASSWORD}
      # Application / site
      - FORGEJO__server__ROOT_URL=${FORGEJO_ROOT_URL:-http://localhost:${FORGEJO_HTTP_PORT:-3000}}
      - FORGEJO__server__DOMAIN=${FORGEJO_DOMAIN:-localhost}
      - FORGEJO__server__SSH_PORT=${FORGEJO_SSH_PORT:-2222}
      - FORGEJO__server__HTTP_PORT=${FORGEJO_HTTP_PORT:-3000}
      # Optional admin creation on first start
      - FORGEJO__security__INSTALL_LOCK=${FORGEJO_INSTALL_LOCK:-false}
      - FORGEJO__security__SECRET_KEY=${FORGEJO_SECRET_KEY}
    volumes:
      # Primary app data (config, logs, sqlite/db if used)
      - ${DOCKER_USER_DATA:-/home/homelab}/docker-data/forgejo:/data
      # Keep git repositories on a shared mount so host/other containers can access
      - ${DOCKER_VOLUME_STORAGE:-/mnt/shared-storage}/data/forgejo/repos:/data/git/repositories
      # Optional: place ssh keys and custom config on persistent host path
      - ${DOCKER_USER_DATA:-/home/homelab}/docker-data/forgejo/ssh:/data/ssh
    networks:
      - default
      - traefik
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:3000/" ]
      interval: 30s
      timeout: 5s
      retries: 5
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.forgejo.rule=Host(`${FORGEJO_DOMAIN:-forgejo.localhost}`)"
      - "traefik.http.routers.forgejo.entrypoints=websecure"
      - "traefik.http.routers.forgejo.tls.certresolver=letsencrypt"

networks:
  default:
    name: forgejo
    driver: bridge
  traefik:
    external: true
    name: traefik
