services:
  vaultwarden:
    image: vaultwarden/server:latest
    container_name: vaultwarden
    restart: unless-stopped
    environment:
      DOMAIN: https://${VAULTWARDEN_DOMAIN:-vaultwarden.yourdomain.com}
      ADMIN_TOKEN: ${VAULTWARDEN_ADMIN_TOKEN:?Set VAULTWARDEN_ADMIN_TOKEN in your environment}
      SIGNUPS_ALLOWED: ${VAULTWARDEN_SIGNUPS_ALLOWED:-false}
      INVITATIONS_ALLOWED: ${VAULTWARDEN_INVITATIONS_ALLOWED:-false}
      ROCKET_PORT: 80
      ROCKET_WORKERS: 4
      DB_HOST: ${VAULTWARDEN_DB_HOST:-shared-postgres}
      DB_USER: ${VAULTWARDEN_DB_USER:-vaultwarden}
      DB_PASSWORD: ${VAULTWARDEN_DB_PASSWORD:?Set VAULTWARDEN_DB_PASSWORD in your environment}
      DB_NAME: ${VAULTWARDEN_DB_NAME:-vaultwarden}
      DB_PORT: ${VAULTWARDEN_DB_PORT:-5432}
      DATABASE_URL: postgres://${DB_USER}:${DB_PASSWORD}@${DB_HOST}:${DB_PORT}/${DB_NAME}
    volumes:
      -  ./data/:/data/
    expose:
      - "80"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/alive"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    labels:
      - com.getarcaneapp.arcane.depends-on=shared-postgres
      - "traefik.enable=true"
      - "traefik.http.routers.vaultwarden.rule=Host(`${VAULTWARDEN_DOMAIN:-vaultwarden.yourdomain.com}`)"
      - "traefik.http.routers.vaultwarden.entrypoints=websecure"
      - "traefik.http.routers.vaultwarden.tls.certresolver=letsencrypt"
      - "traefik.http.services.vaultwarden.loadbalancer.server.port=80"
    networks:
      - traefik

networks:
  traefik:
    external: true
    name: traefik
