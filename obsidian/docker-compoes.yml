services:
  # RustFS Object Storage Server
  rustfs:
    image: rustfs/rustfs:latest
    container_name: rustfs_server
    command: server /data
    user: "${UID:-1000}:${GID:-1000}"
    ports:
      - "9000:9000" # S3 API port
      - "9001:9001" # Web Console port
    environment:
      - RUSTFS_ROOT_USER=${RUSTFS_ROOT_USER:-admin}
      - RUSTFS_ROOT_PASSWORD=${RUSTFS_ROOT_PASSWORD}
    volumes:
      - ${DOCKER_USER_DATA:-/home/homelab}/docker-data/rustfs-data:/data # Separate storage for your S3 bucket data
    restart: unless-stopped
    networks:
      - traefik
    labels:
      - "traefik.enable=true"
      # S3 API Router (e.g., ://yourdomain.com)
      - "traefik.http.routers.rustfs-api.rule=Host(`${RUSTFS_S3_DOMAIN:-s3.localhost}`)"
      - "traefik.http.routers.rustfs-api.entrypoints=websecure"
      - "traefik.http.routers.rustfs-api.tls=true"
      - "traefik.http.routers.rustfs-api.tls.certresolver=letsencrypt" # Match your Traefik resolver name
      - "traefik.http.routers.rustfs-api.service=rustfs-api-svc" # 👈 Links router to API service
      - "traefik.http.routers.rustfs-api.middlewares=rustfs-cors" # 👈 Links router to CORS middleware
      - "traefik.http.services.rustfs-api-svc.loadbalancer.server.port=9000"

      # 2. CORS Middleware Headers (Fixes "Failed to fetch" in Electron/Obsidian)
      - "traefik.http.middlewares.rustfs-cors.headers.accesscontrolallowmethods=GET,PUT,POST,DELETE,HEAD,OPTIONS"
      - "traefik.http.middlewares.rustfs-cors.headers.accesscontrolallowheaders=*"
      - "traefik.http.middlewares.rustfs-cors.headers.accesscontrolalloworiginlist=*"
      - "traefik.http.middlewares.rustfs-cors.headers.accesscontrolexposeheaders=ETag,x-amz-request-id,x-amz-id-2"

      # 2. Web Console Router (for browser access)
      - "traefik.http.routers.rustfs-console.rule=Host(`${RUSTFS_DOMAIN:-rustfs.localhost}`)"
      - "traefik.http.routers.rustfs-console.entrypoints=websecure"
      - "traefik.http.routers.rustfs-console.tls.certresolver=letsencrypt"
      - "traefik.http.routers.rustfs-console.service=rustfs-console-svc"
      - "traefik.http.services.rustfs-console-svc.loadbalancer.server.port=9001"

  # Obsidian Web Server (Accessible via Web Browser)
  obsidian-web:
    image: lscr.io/linuxserver/obsidian:latest
    container_name: obsidian_web
    ports:
      - "3000:3000" # Web UI HTTP
      - "3001:3001" # Web UI HTTPS
    environment:
      - PUID=${UID:-1000}
      - GUID=${GID:-1000}
      - TZ=Asia/Kolkata
      - DISABLE_GPU=true
    volumes:
      - ${DOCKER_USER_DATA:-/home/homelab}/docker-data/obsidian-config:/config # Configuration & plugin settings
      - ${DOCKER_VOLUME_STORAGE:-/mnt/shared-storage}/data/PHVault:/vault # Separate storage for your raw markdown notes
    restart: unless-stopped
    networks:
      - traefik
    labels:
      - "traefik.enable=true"
      # Obsidian Web Router (e.g., ://yourdomain.com)
      - "traefik.http.routers.obsidian.rule=Host(`${OBSIDIAN_DOMAIN:-obsidian.localhost}`)"
      - "traefik.http.routers.obsidian.entrypoints=websecure"
      - "traefik.http.routers.obsidian.tls=true"
      - "traefik.http.routers.obsidian.tls.certresolver=letsencrypt"
      - "traefik.http.services.obsidian.loadbalancer.server.port=3000"
networks:
  traefik:
    external: true
    name: traefik
